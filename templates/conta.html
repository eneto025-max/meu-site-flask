<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Minha conta - Banco Python</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="bank-container">

        <header class="top-bar">

            <div class="logo">
                🏦 Banco Python
            </div>

            <a href="/logout" class="logout">
                Sair
            </a>

        </header>


        <main>

            <p class="welcome">Olá, {{ nome }} 👋</p>

            <h1 class="account-title">Minha conta</h1>


            <div class="balance-card">

                <p class="balance-label">
                    SALDO DISPONÍVEL
                </p>

                <h2>
                    R$ {{ "%.2f"|format(saldo) }}
                </h2>

            </div>


            <h3 class="section-title">
                Movimentações
            </h3>


            <div class="actions">

                <a href="/deposito" class="action-card">
                    <span class="action-icon">💰</span>
                    <strong>Depositar</strong>
                    <small>Adicionar dinheiro</small>
                </a>


                <a href="/saque" class="action-card">
                    <span class="action-icon">💸</span>
                    <strong>Sacar</strong>
                    <small>Retirar dinheiro</small>
                </a>


                <a href="/transferencia" class="action-card">
                    <span class="action-icon">↔️</span>
                    <strong>Transferir</strong>
                    <small>Enviar dinheiro</small>
                </a>


                <a href="/historico" class="action-card">
                    <span class="action-icon">📜</span>
                    <strong>Histórico</strong>
                    <small>Ver movimentações</small>
                </a>

            </div>

        </main>

    </div>

</body>

</html>
