<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Criar conta - Banco Python</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="card">

        <h1>🏦 Criar conta</h1>
        
        {% if erro %}
            <p>{{ erro }}</p>
        {% endif %}

        <p>Crie sua conta no Banco Python</p>

        <form method="POST">

            <input type="text" name="nome" placeholder="Nome" required>

            <br><br>

            <input type="password" name="senha" placeholder="Senha" required>

            <br><br>

            <button type="submit">Criar conta</button>

        </form>
        
    </div>

</body>

</html>
